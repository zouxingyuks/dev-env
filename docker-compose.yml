name: personal-devbox

services:
  tailscale:
    container_name: personal-devbox-tailscale
    image: tailscale/tailscale:v1.102.5
    hostname: personal-devbox
    env_file:
      - path: .env
        required: false
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_AUTH_ONCE: "false"
      TS_USERSPACE: "false"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    tmpfs:
      - /var/lib/tailscale

  devbox:
    container_name: personal-devbox
    image: personal-devbox:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USERNAME: dev
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    entrypoint: ["/usr/local/bin/docker-entrypoint.sh"]
    command: sleep infinity
    init: true
    privileged: true
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "docker", "--host=unix:///var/run/docker.sock", "info"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 3
    depends_on:
      - tailscale
    stdin_open: true
    tty: true
    user: dev
    network_mode: service:tailscale
    env_file:
      - path: .env
        required: false
    environment:
      XDG_CONFIG_HOME: /home/dev/.config
    volumes:
      - personal-devbox-home:/home/dev
      - personal-devbox-docker:/var/lib/docker
      - personal-devbox-containerd:/var/lib/containerd

volumes:
  personal-devbox-home:
    name: personal-devbox-home
  personal-devbox-docker:
    name: personal-devbox-docker
  personal-devbox-containerd:
    name: personal-devbox-containerd
